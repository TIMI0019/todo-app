<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doneify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <img src="{{ url_for('static', filename='images/JOSH.png') }}" alt="Logo" class="brand-logo">
  
  </div>


  <div class="navigation">
  <div class="nav-item active" data-target="tasks-panel">Tasks</div>
  <div class="nav-item" data-target="notes-panel">Notes</div>
  <div class="nav-item" data-target="calendar-panel">Calendar</div>
  </div>
</div>

<main>

  <div class="top-bar">
    <button id="hamburgerBtn" class="hamburger-btn" aria-label="Account menu">
      <span></span><span></span><span></span>
    </button>
  </div>

  <section class="panel active" id="tasks-panel">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a task">
      <button id="addTaskBtn">Add</button>
    </div>
    <div class="bulk-row">
      <button id="deleteSelectedTasks" class="danger">Delete selected</button>
    </div>
    <ul id="taskList"></ul>
  </section>

  <section class="panel" id="notes-panel">
    <div class="note-add-container">
  <input type="text" id="noteTitleInput" placeholder="Note Title">
  <textarea id="noteContentInput" class="note-content-input" placeholder="Note Content..." rows="4"></textarea>
  <button id="addNoteBtn">Add Note</button>
</div>

    <div>


      
    </div>

    <div class="bulk-row">
      <button id="deleteSelectedNotes" class="danger">Delete selected</button>
    </div>
    <div id="noteList"></div>
  </section>

  <section class="panel" id="calendar-panel">
    <div class="cal-header">
      <button id="prevMonth">&larr; Prev</button>
      <span id="calLabel">September 2026</span>
      <button id="nextMonth">Next &rarr;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

</main>

<div class="overlay" id="accountOverlay"></div>

<div class="account-panel" id="accountPanel">
  <button class="account-close" id="accountClose" aria-label="Close">&times;</button>

  <div class="account-photo-wrap">
    {% if photo %}
      <img src="{{ url_for('static', filename=photo) }}" alt="Profile photo" class="account-photo" id="accountPhotoImg">
    {% else %}
      <div class="account-photo account-photo-placeholder" id="accountPhotoImg">{{ username[0]|upper }}</div>
    {% endif %}
    <label for="photoInput" class="account-photo-edit">Change photo</label>
    <span class="account-photo-remove" id="removePhotoBtn">Remove photo</span>
    <input type="file" id="photoInput" accept="image/*" style="display:none;">
  </div>

  <h2 class="account-username">{{ username }}</h2>

  <div class="account-field">
    <span class="account-field-label">Email</span>
    <span class="account-field-value">{{ email if email else "Not set" }}</span>
  </div>
  <div class="account-field">
    <span class="account-field-label">Phone</span>
    <span class="account-field-value">{{ phone if phone else "Not set" }}</span>
  </div>

  <div class="theme-toggle" id="themeToggle">
    <span>Dark mode</span>
    <span id="themeState" class="theme-icon">☀️</span>
  </div>

  <a href="{{ url_for('logout') }}">
    <button class="danger account-logout">Log out</button>
  </a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
