<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doneify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="sidebar">
  <div class="brand">
    <img src="{{ url_for('static', filename='images/JOSH.png') }}" alt="Logo" class="brand-logo">
  
  </div>


  <div class="navigation">
  <div class="nav-item active" data-target="tasks-panel">Tasks</div>
  <div class="nav-item" data-target="notes-panel">Notes</div>
  <div class="nav-item" data-target="calendar-panel">Calendar</div>
  <div class="nav-item" data-target="profile-panel">Profile</div>
  <div class="theme-toggle" id="themeToggle">
    <span> </span>
    <span id="themeState" class="theme-icon">☀️</span>

  </div>
  </div>
</div>

<main>

  <section class="panel active" id="tasks-panel">
    <div class="add-row">
      <input type="text" id="taskInput" placeholder="Add a task">
      <button id="addTaskBtn">Add</button>
    </div>
    <div class="bulk-row">
      <button id="deleteSelectedTasks" class="danger">Delete selected</button>
    </div>
    <ul id="taskList"></ul>
  </section>

  <section class="panel" id="notes-panel">
    <div class="note-add-container">
  <input type="text" id="noteTitleInput" placeholder="Note Title">
  <textarea id="noteContentInput" class="note-content-input" placeholder="Note Content..." rows="4"></textarea>
  <button id="addNoteBtn">Add Note</button>
</div>

    <div>


      
    </div>

    <div class="bulk-row">
      <button id="deleteSelectedNotes" class="danger">Delete selected</button>
    </div>
    <div id="noteList"></div>
  </section>

  <section class="panel" id="calendar-panel">
    <div class="cal-header">
      <button id="prevMonth">&larr; Prev</button>
      <span id="calLabel">September 2026</span>
      <button id="nextMonth">Next &rarr;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section class="panel" id="profile-panel">
    <div class="note-card" style="max-width:320px;">
      <p class="title">{{ username }}</p>
      <p class="content">Logged in</p>
    </div>
    <a href="{{ url_for('logout') }}">
      <button class="danger" style="margin-top:1rem;">Log out</button>
    </a>
  </section>

</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
