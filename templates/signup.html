<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Doneify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .auth-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 1rem;
  }
  .auth-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    width: 320px;
    max-width: 100%;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 1.25rem; }
  .auth-box input[type="text"],
  .auth-box input[type="email"],
  .auth-box input[type="tel"],
  .auth-box input[type="password"] {
    width: 100%;
    margin-bottom: 12px;  
  }

  .email-input, .phone-input {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;  
  }
 
  

  .auth-error 
  { color: var(--pending-text); font-size: 13px; margin-bottom: 12px; }
  .auth-link { font-size: 13px; margin-top: 12px; color: var(--text-muted); }
  .auth-link a { color: var(--accent); }
 
  .password-field {
  position: relative;
  width: 100%;
}

.password-field input {
  width: 100%;
  padding-right: 42px;
  box-sizing: border-box;
}

.password-toggle {
  position: absolute;
  top: 40%;
  right: 10px;
  transform: translateY(-50%);

  width: 24px !important;
  height: 24px !important;

  padding: 0 !important;
  margin: 0 !important;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent !important;
  border: none !important;
  outline: none !important;
  box-shadow: none !important;

  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
}
  .signup-button {
    width: 100%;
    padding: 10px;
    background-color: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
  }

    
    


  .password-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin: -6px 0 12px;
  }

  .login-logo {
    display: block;
    margin: 0 auto 1rem;
    width: 60%;
    height: auto;
  }


</style>
</head>
<body>

<div class="auth-wrap">
  
  <div class="auth-box">
    <img src="{{ url_for('static', filename='images/JOSH.png') }}" alt="Logo" class="login-logo">
    <h1>Create an account</h1>
    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="email" name="email" placeholder="Email" required class="email-input"> 
      <input type="tel" name="phone" placeholder="Phone number (optional)" class="phone-input">

      <div class="password-field">
        <input type="password" name="password" id="password" placeholder="Password" required
          pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}"
          title="At least 8 characters, with an uppercase letter, a lowercase letter, a number, and a special character.">
        <button type="button" class="password-toggle" data-target="password"><i class="fa-regular fa-eye-slash"></i></button>
        
      </div>
      <p class="password-hint">At least 8 characters, with an uppercase letter, a lowercase letter, a number, and a special character.</p>

      <div class="password-field">
        <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm password" required>
        <button type="button" class="password-toggle" data-target="confirm_password"><i class="fa-regular fa-eye-slash"></i></button>
      </div>

      <button type="submit" class="signup-button">Sign up</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>
</div>
<script>
document.querySelectorAll('.password-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
    } else {
      input.type = 'password';
      btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
    }
  });
});
</script>
</body>
</html>
