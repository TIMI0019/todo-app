<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Doneify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  .auth-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 1rem;
    border: 1px solid var(--border);
  }
  .auth-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    width: 320px;
    max-width: 100%;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 1.25rem; }
  .auth-box input[type="text"], .auth-box input[type="password"] {
    width: 100%;
    margin-bottom: 12px;
  }
  .auth-box button { width: 100%; }
  .auth-error { color: var(--pending-text); font-size: 13px; margin-bottom: 12px; }
  .auth-success { color: #4CAF50; font-size: 13px; margin-bottom: 12px; }
  .auth-link { font-size: 13px; margin-top: 12px; color: var(--text-muted); }
  .auth-link a { color: var(--accent); }

  .login-logo {
    display: block;
    margin: 0 auto 1rem;
    width: 80px;
    height: auto;
  }
.password-field {
  position: relative;
  width: 100%;
}

.password-field input {
  width: 100%;
  padding-right: 42px;
  box-sizing: border-box;
}

.password-toggle {
  position: absolute;
  top: 40%;
  right: 10px;
  transform: translateY(-50%);

  width: 24px !important;
  height: 24px !important;

  padding: 0 !important;
  margin: 0 !important;

  display: flex;
  align-items: center;
  justify-content: center;

  background: transparent !important;

  /* THIS removes the circle */
  border: none !important;
  border-radius: 0 !important;
  outline: none !important;
  box-shadow: none !important;

  color: var(--text-muted);
  font-size: 14px;
  cursor: pointer;
}

.password-toggle:hover,
.password-toggle:focus,
.password-toggle:active {
  background: transparent !important;
  border: none !important;
  border-radius: 0 !important;
  outline: none !important;
  box-shadow: none !important;
}

  .remember-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .remember-row input { width: auto; margin: 0; }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <img src="{{ url_for('static', filename='images/JOSH.png') }}" alt="Logo" class="login-logo">

    <h1 style="text-align: center;">Log in</h1>

    <!-- Display flashed success messages (e.g. Password reset successful) -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="auth-success">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Display login error messages -->
    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}

    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>

      <div class="password-field">
        <input type="password" name="password" id="password" placeholder="Password" required>
        <button type="button" class="password-toggle" data-target="password"><i class="fa-regular fa-eye"></i></button>
      </div>

      <label class="remember-row">
        <input type="checkbox" name="remember_me">
        Remember me
      </label>

      <button type="submit">Log in</button>
    </form>

    <p class="auth-link">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
    <p class="auth-link"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  </div>
</div>

<script>
  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
      }
    });
  });
</script>

</body>
</html>
