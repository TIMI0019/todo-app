<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - Doneify</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<style>
  .auth-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 1rem;
  }
  .auth-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem;
    width: 320px;
    max-width: 100%;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 1.25rem; }
  .auth-box input[type="text"], .auth-box input[type="password"] {
    width: 100%;
    margin-bottom: 12px;
  }
  .auth-box button { width: 100%; }
  .auth-error { color: var(--pending-text); font-size: 13px; margin-bottom: 12px; }
  .auth-link { font-size: 13px; margin-top: 12px; color: var(--text-muted); }
  .auth-link a { color: var(--accent); }
</style>
</head>
<body>

<div class="auth-wrap">
  <div class="auth-box">
    <img src="{{ url_for('static', filename='images/JOSH.png') }}" alt="Logo" class="login-logo">

    <h1 style="text-align: center;">Log in</h1>
    {% if error %}
      <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form method="POST">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log in</button>
    </form>
    <p class="auth-link">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </div>
</div>

</body>
</html>
